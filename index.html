<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Driftnote — Write it down. Find it in seconds.</title>

  <!-- One <link> per file: the browser downloads them all at the same time. -->
  <link rel="stylesheet" href="css/base/tokens.css">
  <link rel="stylesheet" href="css/base/reset.css">
  <link rel="stylesheet" href="css/base/typography.css">
  <link rel="stylesheet" href="css/base/a11y.css">
  <link rel="stylesheet" href="css/layout/page.css">
  <link rel="stylesheet" href="css/layout/header.css">
  <link rel="stylesheet" href="css/components/buttons.css">

  <!-- Runs first, so the right theme is set before anything is drawn. -->
  <script src="js/theme-init.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body id="top">
  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- 1. HEADER -->
  <header class="site-header" data-header>
    <div class="container header-inner">
      <a class="logo" href="#top">
        <svg class="logo-mark" aria-hidden="true"><use href="icons.svg#logo"/></svg>
        Driftnote
      </a>

      <button type="button" class="icon-btn menu-toggle" aria-expanded="false" aria-controls="site-nav" data-menu-toggle>
        <span class="visually-hidden">Menu</span>
        <svg class="icon icon-menu" aria-hidden="true"><use href="icons.svg#menu"/></svg>
        <svg class="icon icon-close" aria-hidden="true"><use href="icons.svg#close"/></svg>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Main">
        <ul class="nav-list">
          <li><a href="#features">Features</a></li>
          <li><a href="#demo">Demo</a></li>
          <li><a href="#calculator">Time saved</a></li>
          <li><a href="#pricing">Pricing</a></li>
          <li><a href="#faq">FAQ</a></li>
        </ul>
      </nav>

      <button type="button" class="icon-btn" aria-pressed="false" data-theme-toggle>
        <span class="visually-hidden">Dark mode</span>
        <svg class="icon icon-moon" aria-hidden="true"><use href="icons.svg#moon"/></svg>
        <svg class="icon icon-sun" aria-hidden="true"><use href="icons.svg#sun"/></svg>
      </button>
      <a class="btn btn-primary btn-small header-cta" href="#newsletter">Get updates</a>
    </div>
  </header>

  <main id="main">
  </main>
</body>
</html>
